spring:
  application:
    name: invoice-service
  # Configuración de JPA y Hibernate para PostgreSQL
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Información de conexión a la base de datos PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/facturacion
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest


